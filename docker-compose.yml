version: '3.8'

services:
  backend:
    build: ./backend
    volumes:
      - ./backend/vector_store:/app/vector_store
      - ./backend/tickets.db:/app/tickets.db
    environment:
      # IMPORTANTE: Le decimos al backend que busque a ollama en su contenedor
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=smollm:360m
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    depends_on:
      - backend

  # ESTE ES EL SERVICIO QUE TE FALTABA
  ollama:
    image: ollama/ollama:latest
    container_name: auditoriahelpdeskia-ollama-1
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  proxy:
    image: nginx:stable-alpine
    ports:
      - "5173:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  ollama_data: